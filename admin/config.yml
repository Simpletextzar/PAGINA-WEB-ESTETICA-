backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "pages"
    label: "Páginas"
    files:
      - name: "index"
        label: "Inicio"
        file: "content/index.yml"
        fields:
          - label: "Imagen principal"
            name: "hero_image"
            widget: "image"
