backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"
media_library:
  name: folder-media-library

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "content/home.yml"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Main Image", name: "image", widget: "image" }
